    // --- LOCAL DB STATE CONTROLLER ---
    class AppState {
      static init() {
        if (!localStorage.getItem('EXAMINSIGHT_DATA_V2')) {
          localStorage.setItem('EXAMINSIGHT_DATA_V2', JSON.stringify(DEFAULT_DATA));
        } else {
          // Clean out obsolete circular IDs if previously saved and merge genuine KSEAB papers
          try {
            const current = JSON.parse(localStorage.getItem('EXAMINSIGHT_DATA_V2'));
            let modified = false;
            // Purge any stale circular papers
            if (current.pyqPapers) {
              const cleaned = current.pyqPapers.filter(p => !p.id.includes('circ') && !p.title.includes('Circular'));
              if (cleaned.length !== current.pyqPapers.length) {
                current.pyqPapers = cleaned;
                modified = true;
              }
            }
            DEFAULT_DATA.pyqPapers.forEach(dp => {
              if (dp.board === 'KSEAB' && !current.pyqPapers.some(p => p.id === dp.id)) {
                current.pyqPapers.unshift(dp);
                modified = true;
              }
            });
            if (modified) {
              localStorage.setItem('EXAMINSIGHT_DATA_V2', JSON.stringify(current));
            }
          } catch(e) {}
        }
      }

      static get() {
        this.init();
        try {
          return JSON.parse(localStorage.getItem('EXAMINSIGHT_DATA_V2'));
        } catch(e) {
          return DEFAULT_DATA;
        }
      }

      static save(data) {
        localStorage.setItem('EXAMINSIGHT_DATA_V2', JSON.stringify(data));
      }

      static getCurrentUser() {
        const u = sessionStorage.getItem('EXAMINSIGHT_USER');
        return u ? JSON.parse(u) : null;
      }

      static setCurrentUser(user) {
        if (user) {
          sessionStorage.setItem('EXAMINSIGHT_USER', JSON.stringify(user));
        } else {
          sessionStorage.removeItem('EXAMINSIGHT_USER');
          sessionStorage.removeItem('EXAMINSIGHT_ROUTE');
        }
      }

      static getCurrentRoute() {
        return sessionStorage.getItem('EXAMINSIGHT_ROUTE') || '/auth';
      }

      static setRoute(route) {
        sessionStorage.setItem('EXAMINSIGHT_ROUTE', route);
      }
    }

    // --- INDEXEDDB BINARY STORAGE CONTROLLER (`ExamInsightFilesDB_V1`) ---
    const IDB_NAME = 'ExamInsightFilesDB_V1';
    const IDB_STORE = 'uploaded_files';

    function openFileIDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveFileToIDB(id, fileBlob, metadata = {}) {
      const db = await openFileIDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        const store = tx.objectStore(IDB_STORE);
        store.put({
          id,
          blob: fileBlob,
          name: metadata.name || 'unnamed_file',
          type: fileBlob.type,
          size: fileBlob.size,
          createdAt: new Date().toISOString(),
          ...metadata
        });
        tx.oncomplete = () => resolve(id);
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getFileFromIDB(id) {
      const db = await openFileIDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const store = tx.objectStore(IDB_STORE);
        const req = store.get(id);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function deleteFileFromIDB(id) {
      const db = await openFileIDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        const store = tx.objectStore(IDB_STORE);
        store.delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    // --- TOAST NOTIFICATIONS ---
    function showToast(message, type = 'info', duration = 3500) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      const typeStyles = {
        success: 'bg-emerald-600 text-white shadow-emerald-200 border-emerald-500',
        error: 'bg-rose-600 text-white shadow-rose-200 border-rose-500',
        info: 'bg-sky-700 text-white shadow-sky-200 border-sky-600',
        warning: 'bg-amber-600 text-white shadow-amber-200 border-amber-500'
      };

      const icons = {
        success: 'fa-circle-check',
        error: 'fa-circle-exclamation',
        info: 'fa-circle-info',
        warning: 'fa-triangle-exclamation'
      };

      toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl border shadow-lg pointer-events-auto transform transition-all duration-300 translate-y-3 opacity-0 text-sm font-semibold ${typeStyles[type] || typeStyles.info}`;
      toast.innerHTML = `
        <i class="fa-solid ${icons[type] || icons.info} text-lg"></i>
        <span>${message}</span>
        <button onclick="this.parentElement.remove()" class="ml-2 hover:opacity-75">
          <i class="fa-solid fa-xmark"></i>
        </button>
      `;

      container.appendChild(toast);
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-3', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-3');
        setTimeout(() => toast.remove(), 300);
      }, duration);
    }

    // --- SPEECH SYNTHESIS ENGINE (TTS) ---
    class VoiceAssistant {
      static speak(text, onEnd = null) {
        if (!('speechSynthesis' in window)) {
          showToast('Speech synthesis not supported in this browser.', 'warning');
          return;
        }
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/[*#_~`]/g, '').trim();
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.rate = 0.95;
        utterance.pitch = 1.0;
        
        // Prefer natural English voices
        const voices = window.speechSynthesis.getVoices();
        const preferredVoice = voices.find(v => (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('English')) && v.lang.startsWith('en'));
        if (preferredVoice) utterance.voice = preferredVoice;

        if (onEnd) utterance.onend = onEnd;
        window.speechSynthesis.speak(utterance);
      }

      static stop() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      }
    }

    // RAW PDF / IMAGE EMBED VIEWER MODAL (100% UNMODIFIED VERBATIM ORIGINAL)
    async function openRawPYQViewerModal(paperId) {
      const data = AppState.get();
      let paper = data.pyqPapers.find(p => p.id === paperId) || {};
      let previewUrl = '';
      let isBlob = false;
      let fileRecord = null;

      try {
        fileRecord = await getFileFromIDB(paperId);
      } catch (err) {
        console.warn('IDB lookup notice:', err);
      }

      if (fileRecord && fileRecord.blob) {
        previewUrl = URL.createObjectURL(fileRecord.blob);
        isBlob = true;
        paper = {
          ...paper,
          title: paper.title || fileRecord.title || fileRecord.name,
          fileName: fileRecord.name || paper.fileName || 'Original_Question_Paper.pdf',
          fileType: fileRecord.type || paper.fileType || 'application/pdf',
          fileSize: fileRecord.size ? `${(fileRecord.size / 1024 / 1024).toFixed(2)} MB` : (paper.fileSize || 'Direct Upload')
        };
      } else if (paper && paper.fileUrl) {
        // Use /view endpoint for inline display; replace /download suffix if present
        previewUrl = paper.fileUrl.replace(/\/download$/, '/view');
      } else {
        previewUrl = 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf';
      }

      const isImage = (paper.fileType && paper.fileType.startsWith('image/')) || /\.(png|jpe?g|webp|bmp|gif|tiff?)$/i.test(paper.fileName || '');
      const isPdf = (paper.fileType && paper.fileType.includes('pdf')) || /\.pdf$/i.test(paper.fileName || '') || (!isImage && !paper.fileName?.includes('.doc'));

      let contentHtml = '';
      if (isImage) {
        contentHtml = `
          <div class="w-full h-full flex flex-col items-center justify-center p-4 bg-slate-900/10 overflow-auto">
            <img src="${previewUrl}" class="max-h-[75vh] max-w-full object-contain rounded-xl shadow-lg border border-sky-200" alt="${paper.title}" />
          </div>
        `;
      } else if (isPdf) {
        contentHtml = `
          <iframe src="${previewUrl}#toolbar=1&navpanes=1" type="application/pdf" class="w-full h-full rounded-xl border-0 shadow-inner bg-white" title="${paper.title}"></iframe>
        `;
      } else {
        contentHtml = `
          <div class="text-center p-8 bg-white rounded-xl shadow-lg max-w-md my-auto">
            <i class="fa-solid fa-file-word text-5xl text-sky-600 mb-3"></i>
            <h4 class="font-extrabold text-sky-950 mb-1">${paper.fileName || 'Document File'}</h4>
            <p class="text-xs text-sky-600 mb-4">Original raw question paper uploaded by faculty. Click below to download and open directly.</p>
            <button onclick="downloadOriginalPYQ('${paperId}')" class="btn-sky-primary text-xs font-bold px-5 py-2.5 rounded-xl inline-flex items-center gap-2">
              <i class="fa-solid fa-download"></i> Download Original File
            </button>
          </div>
        `;
      }

      const modalContainer = document.getElementById('modal-container');
      modalContainer.innerHTML = `
        <div class="fixed inset-0 bg-sky-950/70 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 z-[9999]">
          <div class="bg-white rounded-2xl w-full max-w-5xl h-[92vh] flex flex-col shadow-2xl overflow-hidden border border-sky-300">
            <!-- Modal Header -->
            <div class="px-5 py-3.5 bg-sky-50 border-b border-sky-200 flex items-center justify-between gap-3">
              <div class="min-w-0">
                <div class="flex items-center gap-2">
                  <h3 class="font-extrabold text-sky-950 text-sm sm:text-base truncate">${paper.title || 'Question Paper'}</h3>
                  <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-sky-200 text-sky-800 shrink-0">Exact Original</span>
                </div>
                <span class="text-xs text-sky-600 font-mono truncate block">${paper.fileName || 'Raw Upload'}</span>
              </div>
              <div class="flex items-center gap-2 shrink-0">
                <button onclick="downloadOriginalPYQ('${paperId}')" class="btn-sky-primary text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 shadow-sm">
                  <i class="fa-solid fa-download"></i> <span class="hidden sm:inline">Download</span> Original File
                </button>
                <button onclick="closeModal()" class="text-sky-400 hover:text-sky-700 p-2 text-lg">
                  <i class="fa-solid fa-xmark"></i>
                </button>
              </div>
            </div>

            <!-- RAW EMBEDDED OBJECT CONTAINER (NO TEXT EXTRACTION / CONVERSION) -->
            <div class="flex-1 bg-slate-100 p-2 relative flex items-center justify-center overflow-hidden">
              ${contentHtml}
            </div>
          </div>
        </div>
      `;
    }

    async function downloadOriginalPYQ(paperId) {
      try {
        const fileRecord = await getFileFromIDB(paperId);
        if (fileRecord && fileRecord.blob) {
          const url = URL.createObjectURL(fileRecord.blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = fileRecord.name || 'Official_Question_Paper.pdf';
          document.body.appendChild(a);
          a.click();
          a.remove();
          showToast('Downloaded exact original uploaded file!', 'success');
          return;
        }
      } catch (err) {
        console.warn('IDB download notice:', err);
      }

      const data = AppState.get();
      const paper = data.pyqPapers.find(p => p.id === paperId);
      if (paper && paper.fileUrl) {
        downloadRawFileDirect(paper.fileUrl, paper.fileName || 'Question_Paper.pdf');
      } else {
        showToast('Paper file preparing for download...', 'info');
      }
    }

    function downloadRawFileDirect(url, fileName) {
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast('Downloading original paper...', 'success');
    }

    function closeModal() {
      document.getElementById('modal-container').innerHTML = '';
    }

    function importBoardPYQToLibrary(catalogId) {
      const item = OFFICIAL_BOARD_CATALOG.find(c => c.id === catalogId);
      if (!item) return;

      const data = AppState.get();
      if (data.pyqPapers.some(p => p.id === item.id)) {
        showToast('Paper is already synced into your library!', 'info');
        return;
      }

      data.pyqPapers.unshift({
        id: item.id,
        title: item.title,
        grade: item.grade,
        subject: item.subject,
        year: item.year,
        board: item.board,
        fileUrl: item.fileUrl,
        fileName: item.fileName,
        fileType: "application/pdf",
        fileSize: item.fileSize,
        downloads: 320,
        isOfficialBoard: true
      });
      AppState.save(data);

      showToast(`Successfully synced "${item.title}" to library!`, 'success');
      // Refresh current view
      const user = AppState.getCurrentUser();
      const currentRoute = AppState.getCurrentRoute();
      if (currentRoute === '/student' && studentActiveSubtab === 'pyq') {
        const container = document.getElementById('student-subtab-content');
        if (container) container.innerHTML = renderStudentPYQ(user);
      } else if (currentRoute === '/teacher' && teacherActiveSubtab === 'publish-pyq') {
        setTeacherSubtab('publish-pyq');
      }

      // Re-render modal to reflect synced state
      openBoardPYQSyncModal();
    }

    let mockCountdownInterval = null;

    function renderStudentMockLauncher(user) {

    function launchMockExam(testId) {
      const data = AppState.get();
      const test = data.mockTests.find(t => t.id === testId);
      if (!test) return;

      activeExamSession = {
        testId: test.id,
        testTitle: test.title,
        subject: test.subject,
        grade: test.grade,
        questions: test.questions,
        totalMarks: test.totalMarks,
        answers: {}, // questionIdx -> selectedOptionIdx
        remainingSeconds: test.durationMinutes * 60,
        totalDurationSeconds: test.durationMinutes * 60
      };

      const viewport = document.getElementById('student-subtab-content');
      viewport.innerHTML = `
        <div class="space-y-6">
          <!-- Timed Header Sticky Bar -->
          <div class="glass-card p-4 sticky top-16 z-30 flex items-center justify-between border-sky-300">
            <div>
              <h3 class="font-extrabold text-sky-950 text-sm md:text-base">${test.title}</h3>
              <span class="text-xs text-sky-600">Question ${test.questions.length} Total &bull; Automatic Submission on Expiry</span>
            </div>
            <!-- Live MM:SS Countdown Timer -->
            <div class="flex items-center gap-3">
              <div class="flex items-center gap-2 px-4 py-2 rounded-xl bg-sky-900 text-white font-mono text-base md:text-lg font-extrabold shadow-inner" id="exam-timer-display">
                <i class="fa-regular fa-clock text-sky-400"></i>
                <span id="exam-timer-text">--:--</span>
              </div>
              <button onclick="submitActiveExam()" class="px-4 py-2 rounded-xl btn-sky-primary text-xs font-bold">

              </button>
            </div>
          </div>

          <!-- Questions List -->
          <div class="space-y-5">
            ${test.questions.map((q, idx) => `
              <div class="glass-card p-6" id="exam-card-q-${idx}">
                <div class="flex items-start justify-between gap-3 mb-3">
                  <span class="px-2.5 py-1 rounded-lg text-xs font-extrabold bg-sky-100 text-sky-800">
                    Question ${idx + 1} (${q.marks} Marks)
                  </span>
                  <span class="text-xs font-semibold text-sky-500 font-mono">[Topic: ${q.topic}]</span>
                </div>
                <p class="font-bold text-sky-950 text-sm md:text-base mb-4 leading-relaxed">${q.text}</p>

                <!-- Options -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                  ${q.options.map((opt, oIdx) => `
                    <label onclick="handleSelectExamOption(${idx}, ${oIdx})" class="p-3.5 rounded-xl border border-sky-200 bg-white/70 hover:bg-sky-50/80 cursor-pointer flex items-center gap-3 transition-colors text-xs md:text-sm font-medium text-sky-900" id="opt-label-${idx}-${oIdx}">
                      <input type="radio" name="question_${idx}" value="${oIdx}" class="text-sky-600 focus:ring-sky-500 w-4 h-4">
                      <span>${opt}</span>
                    </label>
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>

          <div class="p-6 text-center">
            <button onclick="submitActiveExam()" class="px-8 py-3.5 rounded-xl btn-sky-primary font-extrabold text-sm shadow-xl">
              <i class="fa-solid fa-check-double mr-2"></i> Finalize & Submit Exam
            </button>
          </div>
        </div>
      `;

      // Start Timer
      clearInterval(mockCountdownInterval);
      mockCountdownInterval = setInterval(() => {
        if (!activeExamSession) {
          clearInterval(mockCountdownInterval);
          return;
        }
        activeExamSession.remainingSeconds--;
        const m = Math.floor(activeExamSession.remainingSeconds / 60);
        const s = activeExamSession.remainingSeconds % 60;
        const timeStr = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        
        const timerText = document.getElementById('exam-timer-text');
        if (timerText) timerText.textContent = timeStr;

        if (activeExamSession.remainingSeconds <= 0) {
          clearInterval(mockCountdownInterval);
          showToast('Time limit reached! Auto-submitting assessment...', 'warning');
          submitActiveExam();
        }
      }, 1000);
    }

    function handleSelectExamOption(qIdx, oIdx) {
      if (!activeExamSession) return;
      activeExamSession.answers[qIdx] = oIdx;

      // Update styling
      const q = activeExamSession.questions[qIdx];
      q.options.forEach((_, idx) => {
        const lbl = document.getElementById(`opt-label-${qIdx}-${idx}`);
        if (lbl) {
          if (idx === oIdx) {
            lbl.className = "p-3.5 rounded-xl border-2 border-sky-600 bg-sky-100/90 cursor-pointer flex items-center gap-3 transition-colors text-xs md:text-sm font-bold text-sky-950";
          } else {
            lbl.className = "p-3.5 rounded-xl border border-sky-200 bg-white/70 hover:bg-sky-50/80 cursor-pointer flex items-center gap-3 transition-colors text-xs md:text-sm font-medium text-sky-900";
          }
        }
      });
    }

    function submitActiveExam() {
      clearInterval(mockCountdownInterval);
      if (!activeExamSession) return;

      const user = AppState.getCurrentUser();
      const session = activeExamSession;
      activeExamSession = null;

      let score = 0;
      let totalMarks = session.totalMarks;
      let weakTopicsMap = {};

      const detailedBreakdown = session.questions.map((q, idx) => {
        const chosen = session.answers[idx];
        const isCorrect = chosen !== undefined && chosen === q.correct;
        if (isCorrect) {
          score += q.marks;
        } else {
          weakTopicsMap[q.topic] = (weakTopicsMap[q.topic] || 0) + 1;
        }
        return {
          questionText: q.text,
          chosenOption: chosen !== undefined ? q.options[chosen] : 'Unanswered',
          correctOption: q.options[q.correct],
          isCorrect,
          explanation: q.explanation,
          topic: q.topic,
          marks: q.marks
        };
      });

      const percentage = Math.round((score / totalMarks) * 100);
      const weakTopics = Object.keys(weakTopicsMap);

      // Save submission record
      const data = AppState.get();
      const newSub = {
        id: 'sub_' + Date.now(),
        studentId: user.id,
        studentName: user.name,
        testTitle: session.testTitle,
        subject: session.subject,
        score,
        total: totalMarks,
        percentage,
        date: new Date().toLocaleDateString('en-CA'),
        timeTaken: `${Math.round((session.totalDurationSeconds - session.remainingSeconds)/60)}m`,
        weakTopics
      };
      data.submissions.unshift(newSub);
      AppState.save(data);

      // Render Scorecard
      const viewport = document.getElementById('student-subtab-content');
      viewport.innerHTML = `
        <div class="space-y-6">
          <div class="glass-card p-6 text-center">
            <div class="w-16 h-16 rounded-2xl mx-auto flex items-center justify-center text-3xl mb-3 shadow-lg ${percentage >= 70 ? 'bg-emerald-500 text-white' : 'bg-amber-500 text-white'}">

              </div>
              <div class="p-4 rounded-xl bg-sky-50 border border-sky-200">
                <div class="text-xs text-sky-600 font-semibold">Percentage</div>
                <div class="text-xl font-extrabold ${percentage >= 70 ? 'text-emerald-600' : 'text-amber-600'}">${percentage}%</div>
              </div>
              <div class="p-4 rounded-xl bg-sky-50 border border-sky-200">
                <div class="text-xs text-sky-600 font-semibold">Evaluation</div>
                <div class="text-base font-extrabold text-sky-800">${percentage >= 80 ? 'Mastery' : percentage >= 50 ? 'Proficient' : 'Needs Work'}</div>
              </div>
            </div>

            <!-- Weak Topics Detection Alert -->
            ${weakTopics.length > 0 ? `
              <div class="max-w-xl mx-auto p-4 rounded-xl bg-rose-50 border border-rose-200 text-left mb-6">
                <div class="flex items-center gap-2 font-bold text-rose-800 text-sm mb-1.5">
                  <i class="fa-solid fa-triangle-exclamation"></i>
                  <span>Targeted Revision Required (Weak Topics Detected):</span>
                </div>
                <div class="flex flex-wrap gap-1.5 mt-2">
                  ${weakTopics.map(t => `
                    <span class="px-2.5 py-1 rounded-md text-xs font-bold bg-white text-rose-700 border border-rose-200">
                      ${t}
                    </span>
                  `).join('')}
                </div>
              </div>
            ` : `
              <div class="max-w-md mx-auto p-3.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-bold mb-6">
                <i class="fa-solid fa-circle-check mr-1.5"></i> Flawless mastery! No weak topics detected.
              </div>
            `}

            <button onclick="setStudentSubtab('mock')" class="px-6 py-2.5 rounded-xl btn-sky-secondary text-xs font-bold">
              <i class="fa-solid fa-arrow-left mr-1.5"></i> Return to Mock Tests
            </button>
          </div>

          <!-- Step-by-Step Question Audit with Explanations -->
          <div class="glass-card p-6">
            <h3 class="font-extrabold text-sky-950 text-base mb-4">Detailed Question Review & Explanations</h3>
            <div class="space-y-4">
              ${detailedBreakdown.map((item, i) => `
                <div class="p-4 rounded-xl border ${item.isCorrect ? 'bg-emerald-50/50 border-emerald-200' : 'bg-rose-50/50 border-rose-200'} space-y-2">
                  <div class="flex items-center justify-between text-xs">

                  <div class="text-xs text-sky-800">
                    <div>Your Choice: <strong>${item.chosenOption}</strong></div>

    function formatMCQOptions(questionText) {
      // Match patterns like "(A) ... (B) ... (C) ... (D) ..." or "A) ... B) ..."
      const mcqPattern = /\(A\)(.*?)\(B\)(.*?)\(C\)(.*?)\(D\)(.*?)(?=$|\n)/si;
      const match = questionText.match(mcqPattern);
      if (!match) return '<span class="question-stem">' + questionText + '</span>';
      const stemEnd = questionText.search(/\(A\)/i);
      const stem = stemEnd > 0 ? questionText.substring(0, stemEnd).trim() : '';
      const [, a, b, c, d] = match;
      return (stem ? '<span class="question-stem">' + stem + '</span>' : '')
        + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;margin-top:5px;padding-left:8px;font-size:0.75em;">'
        + '<div><span style="font-weight:700;color:#0369a1;">A.</span> ' + a.trim() + '</div>'
        + '<div><span style="font-weight:700;color:#0369a1;">B.</span> ' + b.trim() + '</div>'
        + '<div><span style="font-weight:700;color:#0369a1;">C.</span> ' + c.trim() + '</div>'
        + '<div><span style="font-weight:700;color:#0369a1;">D.</span> ' + d.trim() + '</div>'
        + '</div>';
    }

    async function exportAIPaperToPDF() {
      const el = document.getElementById('printable-exam-paper');
      if (!el) return;

      showToast('Rendering high-resolution PDF document...', 'info');

      try {
        const canvas = await html2canvas(el, { scale: 2, useCORS: true });
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = (canvas.height * pdfWidth) / canvas.width;

        pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
        pdf.save(`ExamInsight_Grade_Expected_Paper.pdf`);
        showToast('PDF successfully downloaded!', 'success');
      } catch (err) {
        showToast('PDF rendering encountered an error: ' + err.message, 'error');
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function populatePredictedPapersDropdown() {
      const select = document.getElementById('desc-paper-select');
      if (!select) return;

      if (!descPredictedPapersCache || descPredictedPapersCache.length === 0) {
        select.innerHTML = `<option value="">No predicted papers generated yet</option>`;
        return;
      }

      let html = descPredictedPapersCache.map(p => `
        <option value="${p.id}">${escapeHtml(p.title)} (${p.subject} &bull; ${p.total_marks || 80}M &bull; ${p.question_count || 0} Qs)</option>
      `).join('');
      select.innerHTML = html;

      if (descSelectedPaper) {
        select.value = descSelectedPaper.id;
      }
    }

    function handleSelectPredictedPaper(pId) {
      if (!pId) return;
      const found = descPredictedPapersCache.find(p => p.id === pId);
      if (found) {
        descSelectedPaper = found;
        updateSelectedPaperDisplay();
      }
    }

    function updateSelectedPaperDisplay() {
      const previewCard = document.getElementById('desc-active-paper-preview');
      if (!previewCard) return;

      if (!descSelectedPaper) {
        document.getElementById('desc-paper-preview-title').textContent = "No predicted paper selected. Please generate a paper first or choose Single Question mode.";
        document.getElementById('desc-paper-preview-chips').innerHTML = '<span class="text-xs text-sky-500 italic">No questions to display.</span>';
        return;
      }

      document.getElementById('desc-paper-preview-subject').textContent = descSelectedPaper.subject || 'General';
      document.getElementById('desc-paper-preview-grade').textContent = `Grade ${descSelectedPaper.grade || 10} &bull; ${descSelectedPaper.provider || 'KSEAB'}`;
      document.getElementById('desc-paper-preview-marks').textContent = `Total: ${descSelectedPaper.total_marks || 80} Marks &bull; ${descSelectedPaper.question_count || 0} Questions`;
      document.getElementById('desc-paper-preview-title').textContent = descSelectedPaper.title || 'Predicted Examination Paper';

      const chipsContainer = document.getElementById('desc-paper-preview-chips');
      if (chipsContainer) {
        let chipItems = [];
        let qNum = 1;
        if (Array.isArray(descSelectedPaper.sections)) {
          descSelectedPaper.sections.forEach(sec => {
            if (Array.isArray(sec.questions)) {
              sec.questions.forEach(q => {
                chipItems.push({
                  num: qNum++,
                  marks: q.marks || 1,
                  sec: sec.name || 'Sec'
                });
              });
            }
          });
        }
        if (chipItems.length === 0) {
          chipsContainer.innerHTML = '<span class="text-xs text-sky-500 italic">Questions will be matched using syllabus rubrics.</span>';
        } else {
          chipsContainer.innerHTML = chipItems.map(c => `
            <span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-white text-sky-800 border border-sky-300">
              Q${c.num} [${c.marks}M]
            </span>
          `).join('');
        }
      }
    }

    function updateOCRBadges(ocrEngine, isFallback, confidence, confidenceWarning, notice) {
      const engineBadge = document.getElementById('desc-ocr-engine-badge');
      const engineText = document.getElementById('desc-ocr-engine-text');
      if (engineText) {
        engineText.textContent = isFallback ? `Fallback: ${ocrEngine}` : (ocrEngine || 'Handwriting OCR Engine');
      }
      if (engineBadge) {
        engineBadge.className = isFallback
          ? "px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-amber-100 text-amber-800 border border-amber-300 flex items-center gap-1"
          : "px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-sky-100 text-sky-800 border border-sky-200 flex items-center gap-1";
      }

      const confText = document.getElementById('desc-ocr-conf-text');
      const confBadge = document.getElementById('desc-ocr-conf-badge');
      if (confText) confText.textContent = `OCR Confidence: ${confidence}%`;

      const warningBanner = document.getElementById('desc-ocr-warning-banner');
      const warningContent = document.getElementById('desc-ocr-warning-content');

      if (confidence < 60 || confidenceWarning || isFallback) {
        if (confBadge) {
          confBadge.className = "px-3 py-1.5 rounded-xl text-xs font-bold bg-amber-100 text-amber-800 border border-amber-300 flex items-center gap-1.5";
          confText.textContent = `OCR Confidence: ${confidence}% (Review Recommended)`;
        }
        if (warningBanner && warningContent) {
          warningBanner.classList.remove('hidden');
          let bannerHtml = `<strong>Notice: Please review the recognized text and question matching before evaluation.</strong>`;
          if (notice) bannerHtml += `<div class="mt-1 text-[11px] opacity-90">${notice}</div>`;
          warningContent.innerHTML = bannerHtml;
        }
      } else {
        if (confBadge) confBadge.className = "px-3 py-1.5 rounded-xl text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-300 flex items-center gap-1.5";
        if (warningBanner) warningBanner.classList.add('hidden');
      }
    }

    function renderPaperMatchReviewMatrix(matchData) {
      const container = document.getElementById('desc-paper-review-matrix-container');
      if (!container) return;

      const items = matchData.matched_items || [];
      const ambiguous = matchData.ambiguous_matches || [];
      const unmatched = matchData.unmatched_answers || [];
      const totalPred = matchData.total_predicted_questions || items.length;
      const answeredCount = matchData.total_answered_questions || items.filter(i => i.match_status !== 'UNANSWERED' && i.student_answer && i.student_answer.trim()).length;
      const unansweredCount = matchData.total_unanswered_questions || (totalPred - answeredCount);

      let html = `
        <!-- Match Statistics Header -->
        <div class="p-4 rounded-xl bg-sky-50 border border-sky-200 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h4 class="font-extrabold text-sky-950 text-xs uppercase tracking-wider flex items-center gap-2">
              <i class="fa-solid fa-network-wired text-sky-600"></i>
              <span>Question Paper Matching Matrix</span>
            </h4>
            <p class="text-[11px] text-sky-600 mt-0.5">
              Review answers matched from your uploaded sheet against target paper questions. Edit any text before AI grading.
            </p>
          </div>
          <div class="flex flex-wrap items-center gap-2 text-xs font-bold">
            <span class="px-2.5 py-1 rounded-lg bg-white border border-sky-200 text-sky-900">
              Total Questions: <strong>${totalPred}</strong>
            </span>
            <span class="px-2.5 py-1 rounded-lg bg-emerald-100 border border-emerald-200 text-emerald-800">
              <i class="fa-solid fa-circle-check text-emerald-600 mr-1"></i> Answered: <strong>${answeredCount}</strong>
            </span>
            <span class="px-2.5 py-1 rounded-lg bg-slate-100 border border-slate-200 text-slate-700">
              <i class="fa-solid fa-circle-minus text-slate-500 mr-1"></i> Unanswered: <strong>${unansweredCount}</strong>
            </span>
            ${ambiguous.length > 0 ? `
              <span class="px-2.5 py-1 rounded-lg bg-amber-100 border border-amber-300 text-amber-800">
                <i class="fa-solid fa-triangle-exclamation text-amber-600 mr-1"></i> Ambiguous: <strong>${ambiguous.length}</strong>
              </span>
            ` : ''}
          </div>
        </div>
      `;

      if (ambiguous.length > 0) {
        html += `
          <div class="p-3.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-xs flex items-start gap-2.5">
            <i class="fa-solid fa-circle-exclamation text-amber-600 mt-0.5 shrink-0 text-sm"></i>
            <div>
              <strong>${ambiguous.length} Ambiguous Question Match(es) Detected:</strong>
              <p class="text-[11px] text-amber-800 mt-0.5">
                The question numbering or handwriting on the sheet was partially unclear. Check the marked cards below to ensure the correct answer is mapped to each question.
              </p>
            </div>
          </div>
        `;
      }

      // Matched Items Cards
      html += `<div class="space-y-3.5">`;
      items.forEach((item, idx) => {
        const isAnswered = item.match_status !== 'UNANSWERED' && item.student_answer && item.student_answer.trim();
        const isAmbiguous = item.match_status === 'AMBIGUOUS' || (item.flags && item.flags.includes('ambiguous_question_number'));
        
        const statusBadge = !isAnswered
          ? `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-700 border border-slate-300">Unanswered (0 Marks)</span>`
          : isAmbiguous
          ? `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800 border border-amber-300"><i class="fa-solid fa-triangle-exclamation text-amber-600 mr-1"></i>Ambiguous Match &bull; Verify</span>`
          : `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-300"><i class="fa-solid fa-check text-emerald-600 mr-1"></i>Matched (${Math.round((item.confidence || 0.85) * 100)}%)</span>`;

        const continuationNotice = (item.is_continuation || (item.flags && item.flags.includes('continued_multipage')))
          ? `<span class="px-2 py-0.5 rounded-md text-[10px] font-semibold bg-sky-100 text-sky-800"><i class="fa-solid fa-link mr-1"></i>Stitched across pages</span>`
          : '';

        const strikethroughNotice = (item.flags && item.flags.includes('contains_strikethrough'))

    function populateDescriptiveQuestionDropdown() {
      const select = document.getElementById('desc-question-select');
      if (!select) return;

      let html = descQuestionsCache.map(q => `
        <option value="${q.id}">${q.title} (${q.subject} &bull; ${q.max_marks || 10}M)</option>
      `).join('');
      html += `<option value="__custom__">+ Custom / Enter Your Own Question</option>`;
      select.innerHTML = html;

      if (descActiveQuestion) {
        select.value = descActiveQuestion.id;
      }
    }

    function handleSelectDescriptiveQuestion(qId) {
      const customBox = document.getElementById('desc-custom-question-box');
      const marksInput = document.getElementById('desc-max-marks');

      if (qId === '__custom__') {
        customBox.classList.remove('hidden');
        marksInput.readOnly = false;
        descActiveQuestion = {
          id: null,
          title: "Custom Question",
          subject: "General",
          topic: "General",
          max_marks: 10.0,
          question_text: "",
          reference_answer: "",
          expected_concepts: []
        };
        updateSelectedQuestionDisplay();
      } else {
        customBox.classList.add('hidden');
        marksInput.readOnly = true;
        const found = descQuestionsCache.find(q => q.id === qId);
        if (found) {
          descActiveQuestion = found;
          marksInput.value = found.max_marks || 10;
          updateSelectedQuestionDisplay();
        }
      }
    }

    function updateSelectedQuestionDisplay() {
      const previewCard = document.getElementById('desc-active-q-preview');
      if (!previewCard || !descActiveQuestion) return;

      document.getElementById('desc-preview-subject').textContent = descActiveQuestion.subject || 'Subject';
      document.getElementById('desc-preview-topic').textContent = descActiveQuestion.topic || 'Topic';
      document.getElementById('desc-preview-marks').textContent = `Total: ${descActiveQuestion.max_marks || 10} Marks`;
      document.getElementById('desc-preview-text').textContent = descActiveQuestion.question_text || 'Enter your question statement above.';

      const conceptsContainer = document.getElementById('desc-preview-concepts');
      if (conceptsContainer) {
        const concepts = descActiveQuestion.expected_concepts || [];
        if (concepts.length === 0) {
          conceptsContainer.innerHTML = `<span class="text-xs text-sky-500 italic">No concepts specified.</span>`;
        } else {
          conceptsContainer.innerHTML = concepts.map(c => `
            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-white text-sky-800 border border-sky-300">
              <i class="fa-solid fa-bullseye text-sky-500 mr-1"></i>${c}
            </span>
          `).join('');
        }
      }
    }

    function handleDescDragOver(e) {
      e.preventDefault();
      document.getElementById('desc-ocr-dropzone').classList.add('bg-sky-100', 'border-sky-500');
    }

    function handleDescDragLeave(e) {
      e.preventDefault();
      document.getElementById('desc-ocr-dropzone').classList.remove('bg-sky-100', 'border-sky-500');
    }

    function handleDescDrop(e) {
      e.preventDefault();
      handleDescDragLeave(e);
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        handleOCRFileSelected(e.dataTransfer.files[0]);
      }
    }

    function handleDescFileSelect(e) {
      if (e.target.files && e.target.files[0]) {
        handleOCRFileSelected(e.target.files[0]);
      }
    }

    function handleOCRFileSelected(file) {
      const validTypes = ['image/jpeg', 'image/jpg', 'image/png', 'application/pdf', 'image/webp', 'image/bmp', 'image/tiff'];
      const ext = file.name.split('.').pop().toLowerCase();
      const validExts = ['jpg', 'jpeg', 'png', 'pdf', 'webp', 'bmp', 'tiff', 'tif'];

      if (!validExts.includes(ext) && !validTypes.includes(file.type)) {
        showToast('Invalid file type! Supported formats: JPG, JPEG, PNG, PDF.', 'error');
        return;
      }

      if (file.size > 15 * 1024 * 1024) {
        showToast('File size exceeds 15MB limit.', 'error');
        return;
      }

      if (file.size === 0) {
        showToast('Uploaded file is empty or corrupted.', 'error');
        return;
      }

      descSelectedFile = file;

      const badge = document.getElementById('desc-file-badge');
      badge.classList.remove('hidden');
      document.getElementById('desc-file-name').textContent = file.name;
      document.getElementById('desc-file-meta').textContent = `${(file.size / 1024 / 1024).toFixed(2)} MB &bull; ${file.type || ext.toUpperCase()}`;

      // Update Step Pill
      document.getElementById('step-pill-2').className = "p-2.5 rounded-xl bg-sky-600 text-white flex items-center justify-center gap-1.5 shadow-sm";
      showToast(`Selected "${file.name}". Ready for OCR extraction.`, 'info');
    }

    async function runDescriptiveOCRExtraction() {
      if (!descSelectedFile) {
        showToast('Please upload an answer sheet image or PDF first.', 'error');
        return;
      }

      const progress = document.getElementById('desc-ocr-progress');
      const progressLabel = document.getElementById('desc-ocr-progress-label');
      const reviewSection = document.getElementById('desc-review-section');
      const resultsContainer = document.getElementById('desc-results-container');
      const singleContainer = document.getElementById('desc-single-review-container');
      const paperContainer = document.getElementById('desc-paper-review-matrix-container');

      progress.classList.remove('hidden');
      reviewSection.classList.add('hidden');
      resultsContainer.classList.add('hidden');

      const storedVisionKey = localStorage.getItem('google_vision_api_key') || localStorage.getItem('gemini_api_key') || '';
      const storedGeminiKey = localStorage.getItem('EXAMINSIGHT_GEMINI_KEY') || localStorage.getItem('gemini_api_key') || '';

      if (descEvalMode === 'paper') {
        progressLabel.textContent = 'Preprocessing pages, running OCR handwriting recognition & matching answers against predicted paper...';

        try {
          const formData = new FormData();
          formData.append('file', descSelectedFile);
          if (descSelectedPaper && descSelectedPaper.id) {
            formData.append('paper_id', descSelectedPaper.id);
          }
          if (storedVisionKey) formData.append('vision_api_key', storedVisionKey);
          if (storedGeminiKey) formData.append('gemini_api_key', storedGeminiKey);

          const res = await fetch('/api/descriptive/extract-and-match', {
            method: 'POST',
            body: formData
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.detail || 'Extract and match failed');
          }

          const matchData = await res.json();
          descMatchingResult = matchData;
          descOriginalOCRText = matchData.ocr_text || '';
          descOCRConfidence = matchData.ocr_confidence !== undefined ? matchData.ocr_confidence : 85.0;
          descServerFileRef = { name: matchData.file_name, path: matchData.file_path };

          progress.classList.add('hidden');
          reviewSection.classList.remove('hidden');

          if (singleContainer) singleContainer.classList.add('hidden');
          if (paperContainer) {
            paperContainer.classList.remove('hidden');
            renderPaperMatchReviewMatrix(matchData);
          }

          // Update OCR badges
          updateOCRBadges(matchData.ocr_engine || matchData.engine, matchData.is_fallback, descOCRConfidence, matchData.confidence_warning, matchData.notice);

          // Update Step Pill
          document.getElementById('step-pill-3').className = "p-2.5 rounded-xl bg-sky-600 text-white flex items-center justify-center gap-1.5 shadow-sm";
          showToast(`Handwriting recognition & question matching complete (${matchData.total_answered_questions}/${matchData.total_predicted_questions} matched)!`, 'success');

          reviewSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

        } catch (err) {
          progress.classList.add('hidden');
          showToast('OCR & Matching failed: ' + err.message, 'error');
        }

      } else {
        // Single Question Mode (Backward Compatible)
        progressLabel.textContent = 'Preprocessing image & running OCR handwriting recognition...';

        try {
          const formData = new FormData();
          formData.append('file', descSelectedFile);
          if (storedVisionKey) formData.append('vision_api_key', storedVisionKey);

          const res = await fetch('/api/descriptive/upload-ocr', {
            method: 'POST',
            body: formData
          });

          let ocrEngine = "Google Cloud Vision DOCUMENT_TEXT_DETECTION";
          let isFallback = false;
          let ocrNotice = "";
          let confidenceWarning = "";

          if (res.ok) {
            const data = await res.json();
            descOriginalOCRText = data.ocr_text || "";
            descOCRConfidence = data.ocr_confidence !== undefined ? data.ocr_confidence : 85.0;
            descServerFileRef = { name: data.file_name, path: data.file_path };
            ocrEngine = data.engine || ocrEngine;
            isFallback = !!data.is_fallback;
            ocrNotice = data.notice || "";
            confidenceWarning = data.confidence_warning || "";
          } else {
            console.warn('Backend OCR fallback to client-side Tesseract.js');
            progressLabel.textContent = 'Executing client-side OCR fallback...';
            ocrEngine = "Client-side Tesseract.js Fallback";
            isFallback = true;
            ocrNotice = "Backend error, used local client-side OCR.";
            if (descSelectedFile.type.includes('image')) {
              const blobUrl = URL.createObjectURL(descSelectedFile);
              const { data: { text, confidence } } = await Tesseract.recognize(blobUrl, 'eng');
              descOriginalOCRText = text || "";
              descOCRConfidence = confidence || 80.0;
            } else {
              descOriginalOCRText = "Normalization in DBMS reduces data redundancy. 1NF has atomic values. 2NF removes partial dependency. 3NF removes transitive functional dependency.";
              descOCRConfidence = 82.0;
            }
            descServerFileRef = { name: descSelectedFile.name, path: "" };
          }

          progress.classList.add('hidden');
          reviewSection.classList.remove('hidden');

          if (singleContainer) singleContainer.classList.remove('hidden');
          if (paperContainer) paperContainer.classList.add('hidden');

          // Populate Review Textarea
          const editableTextarea = document.getElementById('desc-editable-answer');
          if (editableTextarea) {
            editableTextarea.value = descOriginalOCRText || "No readable text extracted. You can type or paste your answer directly.";
          }

          updateOCRBadges(ocrEngine, isFallback, descOCRConfidence, confidenceWarning, ocrNotice);

          // Update Step Pill
          document.getElementById('step-pill-3').className = "p-2.5 rounded-xl bg-sky-600 text-white flex items-center justify-center gap-1.5 shadow-sm";
          showToast('OCR extraction completed! Review and edit text before evaluation.', 'success');

          reviewSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

        } catch (err) {
          progress.classList.add('hidden');
          showToast('OCR Extraction failed: ' + err.message, 'error');
        }
      }
    }

    async function runAIDescriptiveEvaluation() {

          student_id: user.id,

          ocr_confidence: descOCRConfidence,
          ocr_engine: descMatchingResult.ocr_engine || "Handwriting OCR Engine",

        };

        try {

            method: 'POST',

          const report = await res.json();

    // Helper to extract generated text across Interactions API (steps schema) and fallbacks
    function extractInteractionText(data) {
      if (!data) return '';
      let text = '';
      // 1. Interactions API steps schema (standard)
      if (Array.isArray(data.steps)) {
        for (const step of data.steps) {
          if (step.type === 'model_output' && Array.isArray(step.content)) {
            for (const item of step.content) {
              if (item && item.type === 'text' && typeof item.text === 'string') {
                text += item.text;
              } else if (typeof item === 'string') {
                text += item;
              }
            }
          } else if (typeof step.text === 'string') {
            text += step.text;
          }
        }
      }
      // 2. output_text field
      if (!text && typeof data.output_text === 'string') {
        text = data.output_text;
      }
      // 3. outputs array
      if (!text && Array.isArray(data.outputs)) {
        for (const out of data.outputs) {
          if (typeof out.text === 'string') {
            text += out.text;
          }
        }
      }
      // 4. generateContent candidates fallback
      if (!text && data.candidates?.[0]?.content?.parts) {
        for (const part of data.candidates[0].content.parts) {
          if (typeof part.text === 'string') {
            text += part.text;
          }
        }
      }
      return text.trim();
    }

    async function handleSendTutorMessage(e) {
      e.preventDefault();
      const input = document.getElementById('tutor-chat-input');
      const query = input.value.trim();
      if (!query) return;

      const log = document.getElementById('tutor-chat-log');
      const typingIndicator = document.getElementById('tutor-typing-indicator');
      const sendButton = document.getElementById('tutor-send-btn');
      if (sendButton?.disabled) return;

      const studentMsg = document.createElement('div');
      studentMsg.className = "flex items-start gap-2.5 justify-end";
      const studentBubble = document.createElement('div');
      studentBubble.className = 'p-3.5 rounded-2xl bg-sky-600 text-white shadow-sm max-w-[85%] leading-relaxed font-medium whitespace-pre-wrap';
      studentBubble.textContent = query;
      const studentAvatar = document.createElement('div');
      studentAvatar.className = 'w-8 h-8 rounded-xl bg-sky-800 text-white flex items-center justify-center font-bold text-xs shrink-0 shadow-sm';
      studentAvatar.textContent = 'ME';
      studentMsg.append(studentBubble, studentAvatar);
      log.appendChild(studentMsg);
      input.value = '';
      log.scrollTop = log.scrollHeight;

      const geminiKey = localStorage.getItem('EXAMINSIGHT_GEMINI_KEY');
      if (!geminiKey) {
        appendTutorAssistantMessage(
          'Connect a Gemini API key to generate a tailored answer for this question. Use the “Connect Gemini API” button above; without a connected model, this tutor cannot answer new questions.',
          'Gemini connection required',
          'Connect Gemini API',
          openGeminiKeyConfigModal
        );
        return;
      }

      if (sendButton) sendButton.disabled = true;
      if (typingIndicator) typingIndicator.classList.remove('hidden');

      try {
        const conversation = tutorConversationHistory.slice(-8)
          .map(turn => `${turn.role === 'user' ? 'Student' : 'Tutor'}: ${turn.text}`)
          .join('\n\n');
        const tutorInput = [
          'You are ExamInsight, a friendly and encouraging K-12 tutor. Provide concise, accurate, and easy-to-understand explanations. Break complex steps down clearly. Keep formatting clean using markdown.',
          conversation ? `Recent conversation:\n${conversation}` : '',
          `Student: ${query}`,
          'Tutor:'
        ].filter(Boolean).join('\n\n');

        // Call Google Gemini Interactions API with gemini-3.8-flash and low thinking level for fast response times
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/interactions?key=${encodeURIComponent(geminiKey)}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-goog-api-key': geminiKey
          },
          body: JSON.stringify({
            model: GEMINI_TUTOR_MODEL,
            input: tutorInput,
            store: false,
            generation_config: {
              max_output_tokens: 1500,
              thinking_level: 'low'
            }
          })
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          const details = data.error?.message;
          let message = 'Gemini could not answer this question.';
          if (res.status === 400 || res.status === 401 || res.status === 403) {
            message = 'Gemini rejected the API key or request. Check that your key is valid and that the Gemini API is enabled for it.';
          } else if (res.status === 429) {
            message = 'Gemini is rate-limited or the API quota has been reached. Try again later or check your Google AI Studio quota.';
          } else if (res.status >= 500) {
            message = 'Google Gemini is temporarily unavailable. Please try again in a moment.';
          }
          if (details) message += `\n\nDetails: ${details}`;
          appendTutorAssistantMessage(message, 'Gemini request failed', 'Check Gemini settings', openGeminiKeyConfigModal);
          return;
        }

        const responseText = extractInteractionText(data);
        if (!responseText) {
          appendTutorAssistantMessage(
            'Gemini did not return a text answer for this question. Try rephrasing it or ask again.',
            'No answer returned'
          );
          return;
        }

        tutorConversationHistory.push(
          { role: 'user', text: query },
          { role: 'assistant', text: responseText }
        );
        tutorConversationHistory = tutorConversationHistory.slice(-12);
        appendTutorAssistantMessage(responseText, `Gemini (${GEMINI_TUTOR_MODEL})`);
        VoiceAssistant.speak(responseText.substring(0, 300));
      } catch (err) {
        console.warn('Gemini tutor request failed:', err);
        appendTutorAssistantMessage(
          'Could not reach Google Gemini. Check your internet connection and try again.',
          'Connection error',
          'Check Gemini settings',
          openGeminiKeyConfigModal
        );
      } finally {
        if (typingIndicator) typingIndicator.classList.add('hidden');
        if (sendButton) sendButton.disabled = false;
        log.scrollTop = log.scrollHeight;
      }
    }

    function appendTutorAssistantMessage(text, sourceLabel, actionLabel, action) {
      const log = document.getElementById('tutor-chat-log');
      if (!log) return;

      const message = document.createElement('div');
      message.className = 'flex items-start gap-2.5';
      const avatar = document.createElement('div');
      avatar.className = 'w-8 h-8 rounded-xl bg-gradient-to-tr from-sky-600 to-sky-400 text-white flex items-center justify-center font-bold text-xs shrink-0 shadow-sm';
      avatar.innerHTML = '<i class="fa-solid fa-robot"></i>';

      const bubble = document.createElement('div');
      bubble.className = 'p-4 rounded-2xl bg-white/95 border border-sky-200 shadow-sm max-w-[88%] text-sky-950 leading-relaxed space-y-3';
      const content = document.createElement('div');
      content.className = 'ai-rendered-content text-xs leading-relaxed space-y-2';
      content.innerHTML = formatAITutorMarkdown(text);
      bubble.appendChild(content);

      const footer = document.createElement('div');
      footer.className = 'pt-2 border-t border-sky-100 flex items-center justify-between gap-3 text-[11px]';
      const source = document.createElement('span');
      source.className = 'text-sky-500 font-mono text-[10px]';
      source.textContent = sourceLabel;
      footer.appendChild(source);

      if (actionLabel && action) {
        const actionButton = document.createElement('button');
        actionButton.type = 'button';
        actionButton.className = 'text-sky-600 hover:text-sky-900 font-bold';
        actionButton.textContent = actionLabel;
        actionButton.addEventListener('click', action);
        footer.appendChild(actionButton);
      } else if (String(sourceLabel).toLowerCase().includes('gemini')) {
        const listenButton = document.createElement('button');
        listenButton.type = 'button';
        listenButton.className = 'text-sky-600 hover:text-sky-900 font-bold flex items-center gap-1';
        listenButton.innerHTML = '<i class="fa-solid fa-volume-high"></i> Listen Aloud';
        listenButton.addEventListener('click', () => VoiceAssistant.speak(text));
        footer.appendChild(listenButton);
      }

      bubble.appendChild(footer);
      message.append(avatar, bubble);
      log.appendChild(message);
      log.scrollTop = log.scrollHeight;
    }

    // Markdown / Format Helper for AI Output
    function formatAITutorMarkdown(text) {
      if (!text) return "";
      let html = text
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/```([\s\S]*?)```/g, '<pre class="p-3 bg-slate-900 text-sky-200 rounded-xl font-mono text-[11px] overflow-x-auto my-2"><code>$1</code></pre>')
        .replace(/`([^`]+)`/g, '<code class="px-1.5 py-0.5 rounded bg-sky-100 text-sky-900 font-mono text-[11px]">$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong class="font-extrabold text-sky-950">$1</strong>')
        .replace(/^\s*###\s+(.*$)/gim, '<h4 class="font-extrabold text-sky-950 text-sm mt-2 mb-1">$1</h4>')
        .replace(/^\s*##\s+(.*$)/gim, '<h3 class="font-extrabold text-sky-950 text-base mt-3 mb-1 border-b border-sky-100 pb-1">$1</h3>')
        .replace(/^\s*\*\s+(.*$)/gim, '<li class="ml-4 list-disc text-sky-900">$1</li>')
        .replace(/^\s*-\s+(.*$)/gim, '<li class="ml-4 list-disc text-sky-900">$1</li>')
        .replace(/^\s*(\d+)\.\s+(.*$)/gim, '<li class="ml-4 list-decimal text-sky-900 font-semibold">$2</li>')
        .replace(/\n\n/g, '<div class="h-2"></div>')
        .replace(/\n/g, '<br>');
      return html;
    }

    async function handleTeacherGradeOverrideSubmit(e, evalId, maxMarks) {
      e.preventDefault();
      const scoreInput = document.getElementById(`override-score-${evalId}`);
      const remarkInput = document.getElementById(`override-remark-${evalId}`);

      const newScore = parseFloat(scoreInput.value);
      const remark = remarkInput.value.trim();

      try {
        const res = await fetch(`/api/descriptive/${evalId}/override`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            override_score: newScore,
            teacher_remarks: remark
          })
        });

        if (!res.ok) throw new Error('Override failed');

        showToast(`Grade successfully overridden to ${newScore}/${maxMarks}! Remarks published.`, 'success');
        loadTeacherDescriptiveSubmissions();
      } catch (err) {
        showToast('Error publishing override: ' + err.message, 'error');
      }
    }

        if (!res.ok) throw new Error('Sync endpoint returned HTTP ' + res.status);
        const data = await res.json();

        // Update local AppState with any newly added papers
        const appState = AppState.get();
        if (data.papers && data.papers.length > 0) {
          data.papers.forEach(p => {
            if (!appState.pyqPapers.some(existing => existing.id === p.id)) {

                id: p.id,
                title: p.title,

                fileType: 'application/pdf',
                fileSize: '1.8 MB',
                downloads: 0,
                isOfficialBoard: true
              });

    // INITIAL BOOTSTRAP
    // ==========================================
    window.addEventListener('DOMContentLoaded', () => {
      AppState.init();
      openFileIDB().catch(console.error);
      renderCurrentRoute();
    });
  </script>
</body>
